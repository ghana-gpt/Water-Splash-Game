    <script>
        const gameContainer = document.getElementById('game-container');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        let gameRunning = false;
        let animationFrameId;
        
        const player = {
            x: 0,
            y: 0,
            size: 30,
            speed: 5
        };

        const obstacles = [];
        let score = 0;
        let difficulty = 1;

        function initGame() {
            canvas.width = gameContainer.clientWidth;
            canvas.height = gameContainer.clientHeight;
            player.x = canvas.width / 2 - player.size / 2;
            player.y = canvas.height - player.size * 2;
            
            // Reset game state
            obstacles.length = 0;
            score = 0;
            difficulty = 1;
        }

        function createObstacle() {
            const width = Math.random() * (100 - 30) + 30;
            obstacles.push({
                x: Math.random() * (canvas.width - width),
                y: -50,
                width: width,
                height: 20,
                speed: 2 + difficulty
            });
        }

        function startGame() {
            startScreen.style.display = 'none';
            gameRunning = true;
            initGame();
            gameLoop();
        }

        function endGame() {
            gameRunning = false;
            cancelAnimationFrame(animationFrameId);
            startScreen.style.display = 'flex';
            alert(`Game Over! Score: ${score}`);
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw and update player
            ctx.fillStyle = '#1e90ff';
            ctx.beginPath();
            ctx.arc(player.x + player.size/2, player.y + player.size/2, player.size/2, 0, Math.PI * 2);
            ctx.fill();

            // Create new obstacles
            if (Math.random() < 0.02 * difficulty) {
                createObstacle();
            }

            // Update and draw obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                obstacle.y += obstacle.speed;

                ctx.fillStyle = '#ff4444';
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

                // Check collision
                if (player.x < obstacle.x + obstacle.width &&
                    player.x + player.size > obstacle.x &&
                    player.y < obstacle.y + obstacle.height &&
                    player.y + player.size > obstacle.y) {
                    endGame();
                    return;
                }

                // Remove off-screen obstacles and increase score
                if (obstacle.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score++;
                    if (score % 10 === 0) {
                        difficulty += 0.2;
                    }
                }
            }

            // Draw score
            ctx.fillStyle = '#000';
            ctx.font = '20px Arial';
            ctx.fillText(`Score: ${score}`, 10, 30);

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Controls
        function handleKeyDown(e) {
            if (!gameRunning) return;
            
            if (e.key === 'ArrowLeft' && player.x > 0) {
                player.x -= player.speed;
            } else if (e.key === 'ArrowRight' && player.x < canvas.width - player.size) {
                player.x += player.speed;
            }
        }

        function handleTouch(e) {
            e.preventDefault();
            if (!gameRunning) return;

            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const touchX = touch.clientX - rect.left;
            
            if (touchX < canvas.width / 2) {
                if (player.x > 0) player.x -= player.speed;
            } else {
                if (player.x < canvas.width - player.size) player.x += player.speed;
            }
        }

        // Event listeners
        startBtn.addEventListener('click', startGame);
        document.addEventListener('keydown', handleKeyDown);
        canvas.addEventListener('touchstart', handleTouch, { passive: false });
        canvas.addEventListener('touchmove', handleTouch, { passive: false });
        window.addEventListener('resize', initGame);

        // Initial setup
        initGame();
    </script>

            .backlink {

    <script>
        // Function to create and insert the backlink
        function insertBacklink() {
            if (!document.querySelector('.backlink')) {
                // Create a new div element
                var backlinkDiv = document.createElement('div');
                backlinkDiv.className = 'backlink';
    
                // Create the anchor element
                var backlinkAnchor = document.createElement('a');
                backlinkAnchor.href = 'https://ghana-gpt.com';
                backlinkAnchor.textContent = 'Powered By Ghana-GPT.com';
    
                // Append the anchor to the div
                backlinkDiv.appendChild(backlinkAnchor);
    
                // Append the div to the body
                document.body.appendChild(backlinkDiv);
            }
        }
    
        // Function to remove the backlink
        function removeBacklink() {
            var backlinkDiv = document.querySelector('.backlink');
            if (backlinkDiv) {
                backlinkDiv.remove();
            }
        }
    
        // Function to update the backlink text
        function updateBacklinkText(newText) {
            var backlinkAnchor = document.querySelector('.backlink a');
            if (backlinkAnchor) {
                backlinkAnchor.textContent = newText;
            }
        }
    
        // Function to ensure the backlink is always at the bottom
        function ensureBacklinkAtBottom() {
            var backlinkDiv = document.querySelector('.backlink');
            if (backlinkDiv) {
                document.body.appendChild(backlinkDiv);
            }
        }
    
        // Call the function to insert the backlink
        insertBacklink();
    
        // Example usage of the additional functions
        // Update the backlink text after 5 seconds
        setTimeout(() => {
            updateBacklinkText('Check out Ghana-GPT.COM');
        }, 5000);
    
        // Ensure the backlink is always at the bottom after 10 seconds
        setTimeout(() => {
            ensureBacklinkAtBottom();
        }, 100000);
    
        // Remove the backlink after 15 seconds
        setTimeout(() => {
            removeBacklink();
        }, 15000);
    </script>
